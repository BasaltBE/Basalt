name: Dev Build

on:
  push:
    branches: [development]

permissions:
  contents: write

env:
  PROJECT: DedicatedServer/DedicatedServer.csproj
  DOTNET_VERSION: "10.0.x"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
            artifact: Basalt-dev-win-x64
          - name: Linux x64
            os: ubuntu-latest
            rid: linux-x64
            artifact: Basalt-dev-linux-x64
          - name: macOS x64
            os: macos-latest
            rid: osx-x64
            artifact: Basalt-dev-osx-x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT }}
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output ./publish/${{ matrix.artifact }}

      - name: Remove PDB files
        shell: bash
        run: find ./publish/${{ matrix.artifact }} -name "*.pdb" -delete

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./publish/${{ matrix.artifact }}

  release:
    name: Create Dev Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate tag
        id: tag
        run: |
          short_sha=$(git rev-parse --short HEAD)
          date=$(date -u +%Y%m%d)
          echo "tag=dev-${date}-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "name=Dev Build ${date} (${short_sha})" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Package artifacts
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            zip -r "../${name}-${{ steps.tag.outputs.tag }}.zip" "$dir"
          done

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: true
          generate_release_notes: true
          files: "*.zip"
